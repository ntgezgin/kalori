<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalori</title>
<meta name="theme-color" content="#2f7d5b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f6f8; --card: #ffffff; --text: #1b1f24; --muted: #667080;
  --border: #e1e5ea; --track: #e8ecef; --accent: #2f7d5b; --on-accent: #ffffff;
  --danger: #c62828; --warn-bg: #fff3df; --warn-text: #7a4b00;
  --tabbar-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101317; --card: #1a1f25; --text: #e7eaee; --muted: #98a2ae;
    --border: #2a3139; --track: #2a3139; --accent: #4cbf8a; --on-accent: #0b1a12;
    --danger: #ef6461; --warn-bg: #3a2a10; --warn-text: #ffd08a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
main { max-width: 560px; margin: 0 auto; padding: 12px 12px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px); }
h2 { font-size: 1rem; margin: 0 0 10px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.muted { color: var(--muted); font-size: .9rem; }
.small { font-size: .8rem; }
.danger { color: var(--danger); }
.warn { background: var(--warn-bg); color: var(--warn-text); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: .9rem; }
input, select, textarea, button { font: inherit; color: inherit; }
input, select, textarea {
  width: 100%; min-width: 0; padding: 9px 10px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--bg);
}
textarea { min-height: 90px; font-family: ui-monospace, monospace; font-size: .8rem; }
button { border: 0; border-radius: 10px; padding: 9px 14px; background: var(--accent); color: var(--on-accent); cursor: pointer; font-weight: 600; }
button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
button.del { background: transparent; color: var(--muted); padding: 4px 10px; font-size: 1.1rem; line-height: 1; }
button.del:hover { color: var(--danger); }
button.link { background: none; color: var(--accent); padding: 0; font-weight: 500; font-size: .85rem; }
button.danger-btn { background: var(--danger); color: #fff; }
button:disabled { opacity: .35; cursor: default; }
.row { display: flex; gap: 8px; }
.row > .narrow { flex: 0 0 90px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
.grid .full { grid-column: 1 / -1; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.msg { min-height: 1.2em; margin: 8px 0 0; font-size: .85rem; }
.msg.err { color: var(--danger); }
.msg:empty { min-height: 0; margin: 0; }
.daynav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.daynav > div { text-align: center; }
.daynav #dayLabel { font-weight: 600; }
.daynav button:not(.link) { font-size: 1.5rem; padding: 2px 16px; background: var(--card); color: var(--text); border: 1px solid var(--border); }
.big { font-size: 1.8rem; font-weight: 700; }
.sum { display: flex; align-items: baseline; gap: 8px; }
.bar { height: 10px; background: var(--track); border-radius: 99px; overflow: hidden; margin: 10px 0 6px; }
.bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.bar.over > div { background: var(--danger); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips button { background: var(--bg); color: var(--text); border: 1px solid var(--border); font-weight: 400; font-size: .85rem; padding: 5px 10px; border-radius: 99px; }
.list { list-style: none; margin: 10px 0 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
.list li > :first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: .9rem; padding: 6px 0; }
table { width: 100%; border-collapse: collapse; font-size: .85rem; }
th, td { text-align: right; padding: 6px 4px; border-top: 1px solid var(--border); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
th { color: var(--muted); font-weight: 500; border-top: 0; }
.chart svg { width: 100%; height: auto; display: block; margin-top: 8px; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .dot { fill: var(--accent); }
.chart .goal { stroke: var(--danger); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart text { fill: var(--muted); font-size: 10px; }
h3 { font-size: .9rem; margin: 14px 0 0; color: var(--muted); }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
  background: var(--card); border-top: 1px solid var(--border);
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.tabbar > div { display: flex; width: 100%; max-width: 560px; }
.tabbar button { flex: 1; height: var(--tabbar-h); background: none; color: var(--muted); border-radius: 0; font-weight: 500; }
.tabbar button[aria-selected="true"] { color: var(--accent); font-weight: 700; box-shadow: inset 0 3px 0 var(--accent); }
</style>
</head>
<body>
<main>
  <div id="warn" class="warn" hidden></div>

  <section id="tab-today" class="tab">
    <div class="daynav">
      <button id="prevDay" aria-label="Önceki gün">‹</button>
      <div><div id="dayLabel"></div><button id="toToday" class="link">Bugüne dön</button></div>
      <button id="nextDay" aria-label="Sonraki gün">›</button>
    </div>
    <div class="card">
      <div class="sum"><span id="total" class="big"></span><span id="goalText" class="muted"></span></div>
      <div id="bar" class="bar"><div></div></div>
      <div id="remain" class="muted"></div>
    </div>
    <div class="card">
      <h2>Yemek ekle</h2>
      <form id="foodForm" class="row" autocomplete="off">
        <input id="foodName" placeholder="Yemek adı" aria-label="Yemek adı">
        <input id="foodKcal" class="narrow" inputmode="decimal" placeholder="kcal" aria-label="kcal">
        <button>Ekle</button>
      </form>
      <p id="foodMsg" class="msg err"></p>
      <div id="chips" class="chips"></div>
      <ul id="foodList" class="list"></ul>
    </div>
    <div class="card">
      <h2>Adım</h2>
      <form id="stepsForm" class="row">
        <input id="steps" inputmode="numeric" placeholder="Adım sayısı" aria-label="Adım sayısı">
        <button>Kaydet</button>
      </form>
      <p id="burn" class="muted"></p>
    </div>
    <div class="card">
      <h2>Son 7 gün</h2>
      <div id="week"></div>
    </div>
  </section>

  <section id="tab-measure" class="tab" hidden>
    <div class="card">
      <h2>Yeni ölçüm</h2>
      <form id="measureForm" class="grid" autocomplete="off">
        <label class="full">Tarih<input type="date" id="mDate"></label>
        <div id="mFields" class="grid full"></div>
        <button class="full">Kaydet</button>
      </form>
      <p id="mMsg" class="msg"></p>
    </div>
    <div class="card">
      <div id="weightSummary"></div>
      <div id="chart" class="chart"></div>
    </div>
    <div class="card">
      <h2>İlk / son</h2>
      <div id="mTable"></div>
    </div>
    <div class="card">
      <h2>Geçmiş</h2>
      <ul id="mHistory" class="list"></ul>
    </div>
  </section>

  <section id="tab-sizes" class="tab" hidden>
    <div class="card">
      <h2>Beden kaydı</h2>
      <form id="sizeForm" class="grid" autocomplete="off">
        <label>Tür<select id="sType"></select></label>
        <label>Beden<input id="sSize"></label>
        <label class="full">Marka / ürün<input id="sBrand"></label>
        <label class="full">Not (nasıl oturuyor)<input id="sNote"></label>
        <label class="full">Tarih (isteğe bağlı)<input type="date" id="sDate"></label>
        <button class="full">Kaydet</button>
      </form>
      <p id="sMsg" class="msg"></p>
    </div>
    <div class="card" id="sizeList"></div>
  </section>

  <section id="tab-settings" class="tab" hidden>
    <div class="card">
      <h2>Hedefler</h2>
      <form id="goalForm" class="grid" autocomplete="off">
        <label class="full">Günlük kcal hedefi<input id="gKcal" inputmode="decimal"></label>
        <label>Hedef kilo (kg)<input id="gWeight" inputmode="decimal"></label>
        <label>Pantolon ön ölçü hedefi (cm)<input id="gPants" inputmode="decimal"></label>
        <button class="full">Kaydet</button>
      </form>
      <p id="gMsg" class="msg"></p>
    </div>
    <div class="card">
      <h2>Yedek</h2>
      <p class="muted">Veriler sadece bu tarayıcıda saklanır. Düzenli yedek al.</p>
      <div class="btns">
        <button id="exportBtn">JSON indir</button>
        <button id="fileBtn" class="ghost">Dosyadan içe aktar</button>
        <input type="file" id="fileInput" accept="application/json,.json" hidden>
      </div>
      <h3>Kopyala / yapıştır</h3>
      <textarea id="backupText" placeholder="Yedek JSON'unu buraya yapıştır" spellcheck="false"></textarea>
      <div class="btns">
        <button id="copyBtn" class="ghost">Mevcut veriyi kopyala</button>
        <button id="pasteBtn" class="ghost">Yapıştırılanı içe aktar</button>
      </div>
      <p id="bMsg" class="msg"></p>
    </div>
    <div class="card">
      <h2>Sıfırla</h2>
      <p id="resetText" class="muted">Tüm yemek, adım, ölçü, beden kayıtları ve ayarlar silinir.</p>
      <div class="btns">
        <button id="resetBtn" class="danger-btn">Her şeyi sıfırla</button>
        <button id="resetCancel" class="ghost" hidden>Vazgeç</button>
      </div>
    </div>
  </section>
</main>

<nav class="tabbar" aria-label="Sekmeler">
  <div role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Bugün</button>
    <button role="tab" data-tab="measure" aria-selected="false">Ölçü</button>
    <button role="tab" data-tab="sizes" aria-selected="false">Beden</button>
    <button role="tab" data-tab="settings" aria-selected="false">Ayar</button>
  </div>
</nav>

<script>
'use strict';

const KEY = 'kalori-data';
const FIELDS = [
  ['weight', 'Kilo', 'kg'], ['waist', 'Bel (göbek hizası)', 'cm'], ['chest', 'Göğüs', 'cm'],
  ['neck', 'Boyun', 'cm'], ['biceps', 'Biceps', 'cm'], ['thigh', 'Üst bacak', 'cm'],
  ['pants', 'Pantolon ön ölçü', 'cm'],
];
const GOAL_OF = { weight: 'weightGoal', pants: 'pantsGoal' };
const TYPES = ['Pantolon', 'Gömlek', 'Ceket', 'Tişört / sweatshirt', 'Ayakkabı', 'Diğer'];

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
// Returns null for empty input, NaN for invalid; accepts both "," and "." as decimal separator.
const num = (s) => {
  s = String(s ?? '').trim().replace(/\s/g, '').replace(',', '.');
  return s === '' ? null : (/^-?\d*\.?\d+$/.test(s) ? Number(s) : NaN);
};
const fmt = (n, d = 1) => n.toLocaleString('tr-TR', { maximumFractionDigits: d });
const signed = (n) => (n > 0 ? '+' : '') + fmt(n);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseYmd(k); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const trDate = (k, long) => parseYmd(k).toLocaleDateString('tr-TR', long
  ? { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }
  : { day: 'numeric', month: 'short', year: 'numeric' });
const setMsg = (id, text, err) => { const el = $(id); el.textContent = text; el.classList.toggle('err', !!err); };

// ---------- storage ----------
const empty = () => ({ v: 1, settings: { kcalGoal: 2000, weightGoal: null, pantsGoal: null }, days: {}, measures: [], sizes: [] });

// Validates an imported/stored object; returns a normalized copy or null.
function validate(o) {
  const isObj = (x) => !!x && typeof x === 'object' && !Array.isArray(x);
  const optNum = (x) => x == null || (typeof x === 'number' && Number.isFinite(x) && x >= 0);
  const optStr = (x) => x == null || typeof x === 'string';
  const isDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  if (!isObj(o) || !isObj(o.settings) || !isObj(o.days) || !Array.isArray(o.measures) || !Array.isArray(o.sizes)) return null;
  const s = o.settings;
  if (![s.kcalGoal, s.weightGoal, s.pantsGoal].every(optNum)) return null;
  for (const [k, day] of Object.entries(o.days)) {
    if (!isDate(k) || !isObj(day) || !optNum(day.steps) || !(day.foods == null || Array.isArray(day.foods))) return null;
    if ((day.foods || []).some((f) => !isObj(f) || typeof f.n !== 'string' || typeof f.k !== 'number' || !optNum(f.k) || !optNum(f.t))) return null;
  }
  if (o.measures.some((m) => !isObj(m) || !isDate(m.d) || FIELDS.some(([f]) => !optNum(m[f])))) return null;
  if (o.sizes.some((z) => !isObj(z) || !TYPES.includes(z.type) || typeof z.size !== 'string'
    || !optStr(z.brand) || !optStr(z.note) || !(z.date == null || z.date === '' || isDate(z.date)))) return null;
  const days = {};
  for (const [k, day] of Object.entries(o.days)) days[k] = { foods: day.foods || [], ...(day.steps ? { steps: day.steps } : {}) };
  return {
    v: 1,
    settings: { kcalGoal: s.kcalGoal ?? null, weightGoal: s.weightGoal ?? null, pantsGoal: s.pantsGoal ?? null },
    days,
    measures: [...o.measures].sort((a, b) => a.d.localeCompare(b.d)),
    sizes: o.sizes,
  };
}

let storageOk = true;
let data = empty();
try {
  localStorage.setItem(KEY + '-test', '1');
  localStorage.removeItem(KEY + '-test');
  const raw = localStorage.getItem(KEY);
  if (raw) {
    let parsed = null;
    try { parsed = validate(JSON.parse(raw)); } catch { /* handled below */ }
    if (parsed) data = parsed;
    else showWarn('Kayıtlı veri okunamadı; boş başlatıldı. Yedeğin varsa Ayar sekmesinden içe aktar.');
  }
} catch {
  storageOk = false;
}

function save() {
  if (!storageOk) return;
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch { storageOk = false; showWarn(); }
}
function showWarn(text) {
  const el = $('warn');
  el.textContent = text || 'Tarayıcı depolaması (localStorage) kapalı veya dolu. Girdiğin veriler sayfa kapanınca kaybolur.';
  el.hidden = false;
}
if (!storageOk) showWarn();

// ---------- today ----------
let day = today();
let recent = [];
const getDay = (k) => data.days[k] || { foods: [] };
function putDay(k, d) {
  if (!d.foods.length && !d.steps) delete data.days[k];
  else data.days[k] = d;
  save();
}
const lastWeight = () => [...data.measures].reverse().find((m) => m.weight != null);

function recentFoods() {
  const all = [];
  for (const [d, v] of Object.entries(data.days)) for (const f of v.foods) all.push({ ...f, d });
  all.sort((a, b) => (b.t || 0) - (a.t || 0) || b.d.localeCompare(a.d));
  const seen = new Set(), out = [];
  for (const f of all) {
    const key = f.n.trim().toLocaleLowerCase('tr-TR');
    if (seen.has(key)) continue;
    seen.add(key); out.push(f);
    if (out.length === 10) break;
  }
  return out;
}

function addFood(name, kcal) {
  const d = getDay(day);
  d.foods.push({ n: name, k: kcal, t: Date.now() });
  putDay(day, d);
  renderToday();
}

function renderToday() {
  const isToday = day === today();
  $('dayLabel').textContent = trDate(day, true);
  $('toToday').style.visibility = isToday ? 'hidden' : 'visible';
  $('nextDay').disabled = day >= today();

  const d = getDay(day);
  const total = d.foods.reduce((s, f) => s + f.k, 0);
  const goal = data.settings.kcalGoal;
  $('total').textContent = `${fmt(total, 0)} kcal`;
  $('goalText').textContent = goal ? `/ ${fmt(goal, 0)} hedef` : '';
  $('bar').hidden = $('remain').hidden = !goal;
  if (goal) {
    const over = total > goal;
    $('bar').classList.toggle('over', over);
    $('bar').firstElementChild.style.width = Math.min(100, (total / goal) * 100) + '%';
    $('remain').textContent = over ? `Aşılan: ${fmt(total - goal, 0)} kcal` : `Kalan: ${fmt(goal - total, 0)} kcal`;
    $('remain').classList.toggle('danger', over);
  }

  $('foodList').innerHTML = d.foods.length
    ? d.foods.map((f, i) => `<li><span>${esc(f.n)}</span><span class="muted">${fmt(f.k, 0)} kcal</span>
        <button class="del" data-i="${i}" aria-label="Sil">×</button></li>`).join('')
    : '<li class="empty">Bu gün için kayıt yok.</li>';

  recent = recentFoods();
  $('chips').innerHTML = recent.map((f, i) =>
    `<button type="button" data-i="${i}">${esc(f.n)} · ${fmt(f.k, 0)}</button>`).join('');

  if (document.activeElement !== $('steps')) $('steps').value = d.steps ?? '';
  const w = lastWeight();
  $('burn').textContent = !d.steps ? ''
    : w ? `≈ ${fmt(d.steps * w.weight * 0.0005, 0)} kcal yakım (${fmt(w.weight)} kg ile). Kaba tahmin, hedefe eklenmiyor.`
    : 'Ölçü sekmesine kilo girersen kaba yakım tahmini görünür.';

  let kSum = 0, kN = 0, sSum = 0, sN = 0;
  for (let i = 0; i < 7; i++) {
    const x = data.days[addDays(today(), -i)];
    if (!x) continue;
    if (x.foods.length) { kSum += x.foods.reduce((s, f) => s + f.k, 0); kN++; }
    if (x.steps) { sSum += x.steps; sN++; }
  }
  $('week').innerHTML = `
    <div>Ortalama kcal: <b>${kN ? fmt(kSum / kN, 0) : '–'}</b> <span class="muted">(${kN} gün)</span></div>
    <div>Ortalama adım: <b>${sN ? fmt(sSum / sN, 0) : '–'}</b> <span class="muted">(${sN} gün)</span></div>
    <div class="muted small">Sadece veri girilen günler hesaba katılır.</div>`;
}

$('prevDay').onclick = () => { day = addDays(day, -1); renderToday(); };
$('nextDay').onclick = () => { if (day < today()) { day = addDays(day, 1); renderToday(); } };
$('toToday').onclick = () => { day = today(); renderToday(); };

$('foodForm').onsubmit = (e) => {
  e.preventDefault();
  const name = $('foodName').value.trim();
  const kcal = num($('foodKcal').value);
  if (!name) { setMsg('foodMsg', 'Yemek adı gir.', true); $('foodName').focus(); return; }
  if (!(kcal > 0)) { setMsg('foodMsg', 'Geçerli bir kcal gir.', true); $('foodKcal').focus(); return; }
  setMsg('foodMsg', '');
  addFood(name, kcal);
  $('foodName').value = $('foodKcal').value = '';
  $('foodName').focus();
};
$('foodList').onclick = (e) => {
  const b = e.target.closest('button[data-i]');
  if (!b) return;
  const d = getDay(day);
  d.foods.splice(+b.dataset.i, 1);
  putDay(day, d);
  renderToday();
};
$('chips').onclick = (e) => {
  const b = e.target.closest('button[data-i]');
  if (b) { const f = recent[+b.dataset.i]; addFood(f.n, f.k); }
};

function saveSteps() {
  const n = num($('steps').value.replace(/[.,]/g, '')); // steps are integers; "7.500" means 7500
  if (Number.isNaN(n) || n < 0) { $('burn').textContent = 'Geçerli bir adım sayısı gir.'; return; }
  const d = getDay(day);
  if (n) d.steps = Math.round(n); else delete d.steps;
  putDay(day, d);
  renderToday();
}
$('stepsForm').onsubmit = (e) => { e.preventDefault(); $('steps').blur(); saveSteps(); };
$('steps').onchange = saveSteps;

// ---------- measurements ----------
$('mFields').innerHTML = FIELDS.map(([k, label, unit]) =>
  `<label>${label} (${unit})<input name="${k}" inputmode="decimal"></label>`).join('');
$('mDate').value = today();

const lastOf = (f) => [...data.measures].reverse().find((m) => m[f] != null);

function chart(pts, goal) {
  const W = 320, H = 150, L = 34, R = 10, T = 10, B = 22;
  const vals = pts.map((p) => p.weight).concat(goal != null ? [goal] : []);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (max - min < 1) { min -= 0.5; max += 0.5; }
  const ts = pts.map((p) => parseYmd(p.d).getTime());
  const t0 = ts[0], t1 = ts[ts.length - 1];
  const X = (t) => L + (t1 === t0 ? 0.5 : (t - t0) / (t1 - t0)) * (W - L - R);
  const Y = (v) => T + (1 - (v - min) / (max - min)) * (H - T - B);
  const line = pts.map((p, i) => `${X(ts[i]).toFixed(1)},${Y(p.weight).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilo grafiği">
    <text x="2" y="${T + 8}">${fmt(max)}</text>
    <text x="2" y="${H - B}">${fmt(min)}</text>
    <text x="${L}" y="${H - 6}">${trDate(pts[0].d)}</text>
    <text x="${W - R}" y="${H - 6}" text-anchor="end">${trDate(pts[pts.length - 1].d)}</text>
    ${goal != null ? `<line class="goal" x1="${L}" x2="${W - R}" y1="${Y(goal)}" y2="${Y(goal)}"/>` : ''}
    <polyline class="line" points="${line}"/>
    ${pts.map((p, i) => `<circle class="dot" cx="${X(ts[i]).toFixed(1)}" cy="${Y(p.weight).toFixed(1)}" r="3"/>`).join('')}
  </svg>`;
}

function renderMeasure() {
  for (const [k, , unit] of FIELDS) {
    const m = lastOf(k);
    $('measureForm').elements[k].placeholder = m ? `son: ${fmt(m[k])} ${unit}` : '';
  }

  const w = lastOf('weight');
  const wg = data.settings.weightGoal;
  const weights = data.measures.filter((m) => m.weight != null);
  $('weightSummary').innerHTML = !w ? '<div class="empty">Henüz kilo kaydı yok.</div>' : `
    <div class="sum"><span class="big">${fmt(w.weight)} kg</span><span class="muted">son kilo · ${trDate(w.d)}</span></div>
    ${wg != null ? `<div class="muted">Hedef ${fmt(wg)} kg · kalan ${fmt(Math.abs(w.weight - wg))} kg</div>` : ''}`;
  $('chart').innerHTML = weights.length >= 2 ? chart(weights, wg)
    : w ? '<p class="muted small">Grafik için en az 2 kilo kaydı gerekiyor.</p>' : '';

  const rows = FIELDS.map(([k, label, unit]) => {
    const has = data.measures.filter((m) => m[k] != null);
    if (!has.length) return '';
    const first = has[0][k], last = has[has.length - 1][k];
    const g = GOAL_OF[k] ? data.settings[GOAL_OF[k]] : null;
    return `<tr><td>${label}</td><td>${fmt(first)}</td><td>${fmt(last)}</td><td>${signed(last - first)}</td>
      <td>${g != null ? fmt(g) : ''}</td></tr>`;
  }).join('');
  $('mTable').innerHTML = rows
    ? `<table><tr><th>Ölçü</th><th>İlk</th><th>Son</th><th>Fark</th><th>Hedef</th></tr>${rows}</table>`
    : '<div class="empty">Henüz ölçüm yok.</div>';

  $('mHistory').innerHTML = data.measures.length ? [...data.measures].reverse().map((m) =>
    `<li><span><b>${trDate(m.d)}</b><br><span class="muted">${FIELDS.filter(([k]) => m[k] != null)
      .map(([k, label, unit]) => `${label} ${fmt(m[k])} ${unit}`).join(' · ')}</span></span>
      <button class="del" data-d="${m.d}" aria-label="Sil">×</button></li>`).join('')
    : '<li class="empty">Kayıt yok.</li>';
}

$('measureForm').onsubmit = (e) => {
  e.preventDefault();
  const date = $('mDate').value;
  if (!date) return setMsg('mMsg', 'Tarih seç.', true);
  const entry = {};
  for (const [k, label] of FIELDS) {
    const n = num(e.target.elements[k].value);
    if (n === null) continue;
    if (!(n > 0)) return setMsg('mMsg', `Geçersiz değer: ${label}`, true);
    entry[k] = n;
  }
  if (!Object.keys(entry).length) return setMsg('mMsg', 'En az bir ölçü gir.', true);
  const existing = data.measures.find((m) => m.d === date);
  if (existing) Object.assign(existing, entry);
  else { data.measures.push({ d: date, ...entry }); data.measures.sort((a, b) => a.d.localeCompare(b.d)); }
  save();
  for (const [k] of FIELDS) e.target.elements[k].value = '';
  setMsg('mMsg', existing ? 'Aynı tarihli kayıtla birleştirildi.' : 'Kaydedildi.');
  renderMeasure(); renderToday();
};
$('mHistory').onclick = (e) => {
  const b = e.target.closest('button[data-d]');
  if (!b) return;
  data.measures = data.measures.filter((m) => m.d !== b.dataset.d);
  save(); renderMeasure(); renderToday();
};

// ---------- sizes ----------
$('sType').innerHTML = TYPES.map((t) => `<option>${esc(t)}</option>`).join('');

function renderSizes() {
  const groups = TYPES.map((t) => {
    const items = data.sizes.map((z, i) => ({ ...z, i })).filter((z) => z.type === t);
    if (!items.length) return '';
    return `<h3>${esc(t)}</h3><ul class="list">${items.map((z) => `<li><span><b>${esc(z.size)}</b>
      ${z.brand ? ` · ${esc(z.brand)}` : ''}${z.date ? ` <span class="muted small">(${trDate(z.date)})</span>` : ''}
      ${z.note ? `<br><span class="muted">${esc(z.note)}</span>` : ''}</span>
      <button class="del" data-i="${z.i}" aria-label="Sil">×</button></li>`).join('')}</ul>`;
  }).join('');
  $('sizeList').innerHTML = '<h2>Kayıtlı bedenler</h2>' + (groups || '<div class="empty">Kayıt yok.</div>');
}

$('sizeForm').onsubmit = (e) => {
  e.preventDefault();
  const size = $('sSize').value.trim();
  if (!size) { $('sSize').focus(); return setMsg('sMsg', 'Beden gir.', true); }
  data.sizes.push({ type: $('sType').value, size, brand: $('sBrand').value.trim(), note: $('sNote').value.trim(), date: $('sDate').value });
  save();
  $('sSize').value = $('sBrand').value = $('sNote').value = $('sDate').value = '';
  setMsg('sMsg', 'Kaydedildi.');
  renderSizes();
};
$('sizeList').onclick = (e) => {
  const b = e.target.closest('button[data-i]');
  if (!b) return;
  data.sizes.splice(+b.dataset.i, 1);
  save(); renderSizes();
};

// ---------- settings ----------
function renderSettings() {
  const s = data.settings;
  $('gKcal').value = s.kcalGoal ?? '';
  $('gWeight').value = s.weightGoal != null ? String(s.weightGoal).replace('.', ',') : '';
  $('gPants').value = s.pantsGoal != null ? String(s.pantsGoal).replace('.', ',') : '';
}

$('goalForm').onsubmit = (e) => {
  e.preventDefault();
  const vals = { kcalGoal: num($('gKcal').value), weightGoal: num($('gWeight').value), pantsGoal: num($('gPants').value) };
  if (Object.values(vals).some((v) => v !== null && !(v > 0))) return setMsg('gMsg', 'Geçersiz sayı. Boş bırakabilir veya pozitif sayı girebilirsin.', true);
  data.settings = vals;
  save();
  setMsg('gMsg', 'Kaydedildi.');
  renderAll();
};

function importJson(text) {
  let parsed = null;
  try { parsed = validate(JSON.parse(text)); } catch { /* invalid JSON */ }
  if (!parsed) return setMsg('bMsg', 'Geçersiz yedek: JSON okunamadı veya şema uyuşmuyor. Mevcut veri değişmedi.', true);
  data = parsed;
  save();
  renderAll();
  setMsg('bMsg', `İçe aktarıldı: ${Object.keys(data.days).length} gün, ${data.measures.length} ölçüm, ${data.sizes.length} beden kaydı.`);
}

$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `kalori-yedek-${today()}.json`;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('fileBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = async (e) => {
  const file = e.target.files[0];
  if (file) importJson(await file.text());
  e.target.value = '';
};
$('copyBtn').onclick = async () => {
  $('backupText').value = JSON.stringify(data);
  $('backupText').select();
  try { await navigator.clipboard.writeText($('backupText').value); setMsg('bMsg', 'Panoya kopyalandı.'); }
  catch { setMsg('bMsg', 'Metin kutuya yazıldı; elle kopyalayabilirsin.'); }
};
$('pasteBtn').onclick = () => {
  const t = $('backupText').value.trim();
  if (!t) return setMsg('bMsg', 'Önce yedek JSON\'unu kutuya yapıştır.', true);
  importJson(t);
};

let resetArmed = null;
function disarmReset() {
  clearTimeout(resetArmed); resetArmed = null;
  $('resetBtn').textContent = 'Her şeyi sıfırla';
  $('resetText').textContent = 'Tüm yemek, adım, ölçü, beden kayıtları ve ayarlar silinir.';
  $('resetCancel').hidden = true;
  $('resetText').classList.remove('danger');
}
$('resetBtn').onclick = () => {
  if (!resetArmed) {
    $('resetBtn').textContent = 'Evet, hepsini sil';
    $('resetText').textContent = 'Emin misin? Bu işlem geri alınamaz. Onaylamak için tekrar bas.';
    $('resetText').classList.add('danger');
    $('resetCancel').hidden = false;
    resetArmed = setTimeout(disarmReset, 8000);
    return;
  }
  disarmReset();
  data = empty();
  save();
  day = today();
  renderAll();
  setMsg('bMsg', '');
  $('resetText').textContent = 'Tüm veriler silindi.';
};
$('resetCancel').onclick = disarmReset;

// ---------- tabs ----------
document.querySelector('.tabbar').onclick = (e) => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  for (const t of document.querySelectorAll('[data-tab]')) t.setAttribute('aria-selected', t === b);
  for (const s of document.querySelectorAll('.tab')) s.hidden = s.id !== 'tab-' + b.dataset.tab;
  if (b.dataset.tab === 'today') renderToday(); // date may have rolled over
  window.scrollTo(0, 0);
};

function renderAll() { renderToday(); renderMeasure(); renderSizes(); renderSettings(); }
renderAll();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
